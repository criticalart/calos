# yazi.toml
[mgr]
show_hidden = true

[opener]

wallpaper = [
{ run = 'awww img %s --resize stretch --transition-type random --transition-fps 144 --transition-duration 1; ln -nsf %s $HOME/.config/calos/current/background; sleep 0.2; cp %s ~/Pictures/Wallpapers/', desc = "Set and Add as Wallpaper" }
]

imageedit = [
{ run = 'pinta %s', desc = "Pinta Image Editor" }
]

image = [
{ run = 'pqiv -i --scale-mode-screen-fraction=0.33 %s', desc = "Pqiv Image Viewer" },
]

text = [
	{ run = 'nvim %s', block = true, desc = "Neovim Text Editor"},
]
 
glow = [
	{ run = 'glow -t %s', block = true, desc = "Glow Markdown Viewer"},
]

extract = [
 {  run = '7z x %s -o*',  desc = "Extract with 7zip" }
]

extracttar = [
{ run = 'tar -xf %s', desc = "Extrar .tar.xz file" }
]

execute = [
    { run = '%s', block = true, desc = "Execute as shell command"},
]

music = [
{ run = 'ffplay -nodisp -autoexit %s' },
]

video = [
{ run = 'ffplay %s' },
]

imageclip = [
{ run = 'wl-copy --type image/png < %s', desc = "Copy Image to Clipboard" },
]

[open]

rules = [

{ url = "*.zip", use = "extract" },

{ url = "*.rar", use = "extract" },

{ url = "*.7z", use = "extract" },

{ url = "*.gif", use = [ "image", "imageclip" ] },

{ url = "*.jpg", use =  [ "image", "imageedit", "wallpaper", "imageclip" ] },

{ url = "*.png", use =  [ "image", "imageedit", "wallpaper", "imageclip" ] },

{ url = "*.conf", use = "text" },

{ url = "*.toml", use = "text" },

{ url = "*.txt", use = "text" },

{ url = "*.ini", use = "text" },

{ url = "*.jsonc", use = "text" },

{ url = "*.yml", use = "text" },

{ url = "*.json", use = "text" },

{ url = "*.lua", use = "text" },

{ url = "*.css", use = "text" },

{ url = "*.js", use = "text" },

{ url = "*.bash*", use = "text" },

{ url = "*.mp3", use = "music"},

{ url = "*.wav", use = "music"},

{url = "*.md", use = [ "glow", "text" ]},

{ url = "*.ogg", use = "music"},

{ url = "*.mkv", use = "video"},

{ url = "*.mp4", use = "video"},

{url = "*.sh", use = [ "text", "execute" ]},

{ url = "*.tar.xz", use = "extracttar"},

{ url = "*.tar.gz", use = "extracttar"},

  { url = "*", use = [ "text", "execute" ] }

]

[[plugin.prepend_previewers]]
url = "*/"
run = "eza-preview"
